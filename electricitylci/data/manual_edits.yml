#This is in response to issue #77. This plant had 0 generation
#in 2016 which is causing issues. See
#https://github.com/USEPA/ElectricityLCI/issues/77 for more info.
        entry_7:
          edit_type: "remove"
          data_source: "yaml"
          filters:
            eGRID_ID:
              - 60880
            Year:
              - 2016
# One of these has been an issue since 2016 - Issue #190.
# 60822 is an industrial facility, specifically electronics manufacturing
# that has significant SF6 emissions. Since these emissions aren't expected to
# come from solar power generation in any significant quantities, we'll just
# remove for now.
        entry_8:
          edit_type: "remove"
          data_source: "yaml"
          filters:
            eGRID_ID:
              - 60822
            FlowName:
              - "Sulfur hexafluoride"
            Source:
              - "NEI"
            Year:
              - 2020
        entry_9:
          edit_type: "remove"
          data_source: "yaml"
          filters:
            eGRID_ID:
              - 62208
