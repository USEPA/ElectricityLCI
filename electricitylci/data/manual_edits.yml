# Heavy-handed method to remove Hawaii balancing authority from generation
# data; see Issue 276 for current decision [26.02.06; TWD]
        entry_11:
          edit_type: "remove"
          data_source: "yaml"
          filters:
            Balancing Authority Code:
              - "HECO"
# Entries 12 & 13 drop the elevated Chloromethane air emissions from WI hydro
