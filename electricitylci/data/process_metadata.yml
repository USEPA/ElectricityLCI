  DatasetOwner: 'NETL'

  DataGenerator: 'NETL'

  DataDocumentor: 'NETL'

  ModelingConstants: ''

  DataSelection:
    'The inventories represent the construction of either natural gas combined cycle or coal power plants using an economic input output life cycle inventory model (Yang et al., 2017) and the construction costs for these plants as detailed by NETL techno-economics analysis (Fout et al., 2015).'

  DataTreatment:
    'These type different types of power plants are then assigned to the various power plants according to the plant they most resemble.
    The inventories are then scaled according to power plant name plate capacity relative to the source power plants and then allocated over an assumed 30 year life.
    The single year of impacts are then divided by the generation of the year selected in the model configuration, which is why input amounts are typically less than 1 unit.'

  TemporalDescription:
    'The construction inventory was built on several years of data.
    The inventory was generated with a target year of 2016.
    It includes data from a 2015 techno-economic analysis and is scaled based on the model generation year.'

  SamplingProcedure:
    - 'BOUNDARY CONDITIONS'
    - 'The construction inventories are generated using an economic input output model and so should catch all materials and manufacturing processes that go into creating the power plant.'
    - ''
    - 'DATA COLLECTION'
    - 'All inventories were calculated using secondary data from publicly available datasets.'
    - ''
