consumption_mix:

  ModelingConstants:
    - 'There should exist inputs for all generation mixes that contribute to the consumption mix of the stated region, but in some cases there may not be an available provider.
      This likely means that there was no available data for the generation mix for that region.'

  TechnologyDescription:

  TemporalDescription:
    'The time frame reflects the modeled trading year.'

  use_egrid:

    Description:
      - ''
      - 'Functional Unit: 1 MWh of high voltage electricity'
      - 'Co-products: N/A'
      - 'Default co-product approach: N/A'
      - 'Data source: Hottle & Ghosh (2021)'
      - ''
      - 'This process is a part of NETL''s electricity baseline and is intended to capture the electricity grid consumption mix for the given region in the US. '

    DataTreatment:
      'FERC Form 714 and international trading data in conjunction with the updated generation mixes.
      There are two different approaches to estimating generation mixes described here: 1) Net Trading and 2) Gross Trading.
      Both approaches are based on a trading methodology intended to replicate real-world electricity trading between eGRID subregions within the NERC regions.
      The Net Trading approach assumes that the eGRID regions first provide electricity for their own demand and provide any surpluses (generation>demand) to the shared pool for their respective NERC region whereas the Gross Trading approach contributes all trades out to the shared NERC pool then the eGRID regions draw from that shared pool to meet their annual demand. '

    DataCollectionPeriod:
      'The FERC Form 714 data used to model the trading for the consumption inventories is based on 2014 reported trades.'

    DataSelection: 'FERC Form 714'

    Sources:

      Source1:
        <<: *hottle_ghosh_2021

  replace_egrid:

    Description:
      - ''
      - 'Functional Unit: 1 MWh of high voltage electricity'
      - 'Co-products: N/A'
      - 'Default co-product approach: N/A'
      - 'Data source: Various (see sources)'
      - ''
      - 'This process is a part of NETL''s electricity baseline and is intended to capture the electricity grid consumption mix for the given region in the US. '

    DataTreatment:
      'US Energy Information Administration (EIA) Form EIA-930 electricity trading data is used to inform an input/output model of electricity trading.
      This model uses generation and trading data at the balancing authority area to calculate the net flow of electricity across all balancing authority areas.
      As a result, the consumption mixes for all levels of aggregation (BA, FERC, and US) are linked to balancing authority area generation mixes. '

    DataCollectionPeriod:
      'Form EIA-930 data is available from the last half of 2015 through today via the bulk data download that the module uses.
      All years between are available for generating consumption mixes.'

    DataSelection: 'EIA Form 930 and EIA 923'

    Sources:

      Source1:
        <<: *de_chalendar_2019

      Source2:
        <<: *qu_etal_2017

      Source3:
        <<: *qu_etal_2018

      Source4:
        <<: *ingwersen_etal

