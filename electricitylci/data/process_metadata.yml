# The default documentation is going to serve as the documentation for
# generation processes wherein the inventory is reported emissions from
# the specified sources - so eGRID, NEI, TRI, etc. All other fuel categories
# and process types will need to generate a different set of documentation
# or the defaults will need to apply.
default:

  techno_process: &default_techno_process
    - 'The emissions contained in this process are the reported emissions of all of the facilities in the stated region/fuel type per MWh.
      The boundary of these emissions are within the boundaries of the electricity generating facilities.
      For the mixed plant category, the emissions can be from any facility within the region that does not match the threshold set in the model configuration file.'

  Description:
    - ''
    - 'Functional unit: 1 MWh of high-voltage electricity'
    - 'Co-products: N/A'
    - 'Default co-product approach: N/A'
    - 'Data source: ElectricityLCI (2025)'
    - ''
    - 'This process is a part of NETL''s electricity baseline and is intended to capture the emissions inventory for electricity generation in the US. '

  TechnologyDescription: *default_techno_process

  TemporalDescription: &gen_proc_temp_desc
    'The time frame reflects the period for all background data (e.g., eGRID, TRI, NEI, and RCRAInfo), NETL inventory data (e.g., for renewables and power plant water use), and model generation year (e.g., EIA Form 923).'

  Start_date: ''

  End_date: ''

  SamplingProcedure:
    - *boundary_statement
    - ''
    - *data_collection_statement
    - ''
    - *uncertainty_statement

  IntendedApplication:
    'The intended application for this inventory is to provide high-resolution electricity data for the establishment of robust background data used in LCIs of US systems.
    These data were developed as regionally specific, average electricity generation/consumption LCI for use in the application of LCAs where accurate electricity inventories are needed to assess the system of interest and/or to evaluate the sensitivity to changes in supplied electricity.
    A full inventory of environmental flows are included enabling use of a full range of LCIA impact categories.'

  DatasetOwner: 'NETL'

  DataGenerator: 'NETL'

  DataDocumentor: 'NETL and ERG'

  AccessUseRestrictions: 'No Restrictions'

  ProjectDescription:
    'The current project development is funded by the Department of Energy National Energy Technology Laboratory (DOE/NETL) under the SA Contract (89243323CFE000075).
    Support for this project is provided by Eastern Research Group (ERG).
    Previous development was supported by the US Environmental Protection Agency (USEPA) under the USEPA Air, Climate, and Energy national research program and by the National Laboratory of the Rockies (NLR).'

  LCIMethod:
    - 'Attributional'
    - 'Gate-to-Gate process'

  ModelingConstants: ''

  DataCompleteness: ''

  use_egrid:
    DataTreatment:
      'Electricity generation processes are primarily based on facility-reported data.
      All the facilities defined in the eGRID ''Plants'' list are the electricity generators used as the pool for creating the LCI.
      The net generation quantity reported in the ''Plants'' list was used for
      generation amount.
      The annual heat input was used to estimate the energy in the fuel or directly captured energy.
      The heat input to the plant is converted to a physical flow by using information about the fuel source being used and the EIA data for heat content of those respective fuel sources.
      Emissions and wastes from these facilities are gathered from eGRID as well as the USEPA emissions and waste inventories, NEI, TRI, and RCRAInfo.
      Alternative generation data was gathered from EIA-923 when the emissions or waste inventories correspond to a non-egrid year.
      The eGRID subregion identifier in the ''Plants'' list was used to associate a facility with a region.
      The fuel and energy types used for the aggregation are the eGRID fuel categories---oil, natural gas, synthetic gas, nuclear fuel, hydroelectric, biomass, wind, solar, geothermal and other fuel---except for the coal sources, which are further disaggregated by the eGRID reported primary fuel.
      The coal fuels are bituminous coal, lignite coal, sub-bituminous coal, refined coal, and waste coal.
      Each generation process, defined by fuel type and regions, includes a fuel or energy input, linkage to an infrastructure process, and emissions to air, water, and soil, and hazardous waste reported by facilities in that region in the form of emission and waste factors. '

    DataSelection:
      'eGRID is a US EPA compiled inventory of electricity generation and selected greenhouse gas and criteria air pollutant emissions for electric power generators that sell electricity to the grid in the United States.
      eGRID is a primary source along with other USEPA maintained national emission and waste inventories for modeling generation.
      These inventories include the Toxic Release Inventory (TRI), the National Emissions Inventory (NEI), and Resources Conservation and Recycling Acts'' Biennial Report, which is stored in system called RCRAInfo.
      The Energy Information Administration (EIA) compiles generation and fuel use data in EIA-923 report used for generation data for odd years when eGRID generation data are not available.
      EIA also provides heat-content data on fossil and nuclear fuel inputs, which are used to relate heat input data to mass quantities of fuel.
      The Federal Energy Regulatory Commission (FERC) receives and reports electricity trading data on the grid in its 714 form.
      These data are used for modeling electricity trade across regions.'

  replace_egrid:
    DataTreatment:
      'Electricity generation processes are primarily based on facility-reported data.
      All the facilities defined in the eGRID ''Plants'' list are the electricity generators used as the pool for creating the LCI or if the configuration parameter replace_egrid is True then all facilities reported in EIA 923 data are used.
      The net generation quantity reported in the ''Plants'' list was used for generation amount.
      The annual heat input was used to estimate the energy in the fuel or directly captured energy.
      The heat input to the plant is converted to a physical flow by using information about the fuel source being used and the EIA data for heat content of those respective fuel sources.
      Emissions and wastes from these facilities are gathered from eGRID as well as the USEPA emissions and waste inventories, NEI, TRI, and RCRAInfo.
      Alternative generation data was gathered from EIA-923 when the emissions or waste inventories correspond to a non-egrid year.
      The plants are associated with various regions depending on model configuration with region names coming from eGRID and EIA.
      The fuel and energy types used for the aggregation are the eGRID fuel categories: oil, natural gas, synthetic gas, nuclear fuel, hydroelectric, biomass, wind, solar, solar thermal, geothermal and other fuel.
      Coal sources can be further disaggregated by the reported primary fuel: bituminous coal, lignite coal, sub-bituminous coal, refined coal, and waste coal.
      Each generation process, defined by fuel type and regions, includes a fuel or energy input, linkage to an infrastructure process, and emissions to air, water, and soil, and hazardous waste reported by facilities in that region in the form of emission and waste factors. '

    DataSelection:
      'eGRID is a US EPA compiled inventory of electricity generation and selected greenhouse gas and criteria air pollutant emissions for electric power generators that sell electricity to the grid in the United States.
      eGRID is a primary source along with other USEPA maintained national emission and waste inventories for modeling generation.
      These inventories include the Toxic Release Inventory (TRI), the National Emissions Inventory (NEI), and Resources Conservation and Recycling Acts'' Biennial Report, which is stored in system called RCRAInfo.
      The Energy Information Administration (EIA) compiles generation and fuel use data in EIA-923 report used for generation data for odd years when eGRID generation data are not available.
      EIA also provides heat-content data on fossil and nuclear fuel inputs which are used to relate heat input data to mass quantities of fuel.
      The Federal Energy Regulatory Commission (FERC) receives and reports electricity trading data on the grid in its 714 form.
      These data are used for modeling electricity trade across regions.'

