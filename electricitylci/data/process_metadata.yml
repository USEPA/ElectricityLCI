  ModelingConstants:
    'All processes use parameters that allow some differentiation based on region or coal type.
    Details on the coal modeling can be found in the NETL Coal Baseline report published in 2023: https://doi.org/10.2172/2370100.

    The model scope is intended to include fossil fuel resource production through delivery to the end user via the vehicle or pipeline transport in the United States.
    This scope is broken down into stages for production, mixes of produced fuel, mixes of consumed fuel, and distribution to the final user.
    Inputs to fuel production including fuels, capital infrastructure and other purchased goods or extracted resources, and any chemical release and hazardous wastes generated.
    One megajoule (MJ) is the declared unit used in processes within upstream life cycle stages. '

  DataSelection:
    'USGS data was crucial in contributing data on coal production and blending through their guidelines on coal resource estimation and classification.
    AP-42 is a compilation of air emissions factors for over 200 air pollution source categories across various industries.
    AP-42 and EIA also provide heat-content data on fossil and nuclear fuel inputs which are used to relate heat input data to mass quantities of fuel and air emissions factors for fuels.
    These data are used for modeling fossil fuel production across regions.
    Further information can be found in the coal baseline report published in Cutshaw et al. (2023).'

  DataTreatment:
    'The coal model divides annual reported and calculated emissions by either the production rate at a mine or the throughput at a facility to provide results on the basis of 1 kg coal.'

  SamplingProcedure:
    - 'BOUNDARY CONDITIONS'
    - 'The coal life cycle model includes emissions from coal mining itself, the manufacturing of coal mining equipment, site construction and commissioning, and coal cleaning as applicable.'
    - ''
    - 'DATA COLLECTION'
    - 'For coal extraction there are two major processes that form the basis of the coal life cycle model - underground and surface coal mining.
      These are connected to auxiliary processes that provide inventories from things like coal mine methane emissions, water use, water emissions, etc.
      Data from 2016 were used to define the amount, type, and origin of the coal used by each power plant, as well as year-specific parameters such as coal mine methane emissions.
      All inventories were calculated using secondary data from publicly available datasets.'
    - ''
    - *no_uncertainty

  DataCollectionPeriod:
    'This inventory represents efforts conducted between 2018 and 2020.'

  Sources:

    Source1:
      <<: *netl_2024_4846

