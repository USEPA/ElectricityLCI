      Source2:
        <<: *netl_2019_2039

  LCIMethod:
    - 'Attributional'
    - 'Cradle-to-Gate process'

  IntendedApplication:
    'This process is intended to serve the upstream inventory to natural gas electricity generation and was created as a part of NETL''s electricity baseline.'

  TechnologyDescription:
    'Technologies span production, gathering & boosting, processing, transmission stations, storage, pipelines, and distribution. '

  DatasetOwner: 'NETL'

  DataGenerator: 'NETL'

  DataDocumentor: 'NETL'

  ModelingConstants:
    'The NETL natural gas life cycle model includes parameters to generate inventories for natural gas extraction across all stages of the natural gas supply chain based on scenarios developed in Littlefield et al. (2019).

    The model scope is intended to include fossil fuel resource production through delivery to the end user via the vehicle or pipeline transport in the United States.
    This scope is broken down into stages for production, mixes of produced fuel, mixes of consumed fuel, and distribution to the final user.
    Inputs to fuel production including fuels, capital infrastructure and other purchased goods or extracted resources, and any chemical release and hazardous wastes generated.'

  DataSelection:
    'Data for this system process comes from a variety of sources.
    Main sources for emissions are EPA Greenhouse Gas Reporting Program and drilling info which provides well-level production information.'

  DataTreatment:
    'The natural gas model divides annual reported and calculated emissions by either the production rate at a well or the throughput at a facility to provide results on the basis of 1 MJ natural gas (using higher heating value for conversion).'

  SamplingProcedure:
    - 'BOUNDARY CONDITIONS'
    - 'This system process provides cradle-to-gate inventory for the US production of natural gas.'
    - ''
    - 'DATA COLLECTION'
    - 'All inventories were calculated using secondary data from publicly available datasets.'
    - ''
    - 'UNCERTAINTY'
    - 'Portions (mainly greenhouse gasses) of this inventory provided by this unit process are the average of a bootstrapping approach to find the average based on a relatively small sample of facilities in the natural gas supply chain.
      Other portions of the natural gas life cycle did not consider uncertainty.
      In either case, the unit process used for the inventory does not provide any uncertainty (i.e., all emissions are static values).'

oil_upstream:

  Description:
    - 'The cradle-to-gate inventory for production of refinery products (residual fuel oil or diesel fuel oil) for each U.S. Petroleum Administration for Defense District (PADD).'
    - ''
    - 'Functional unit: 1 MJ of petroleum fuel through transportation'
    - 'Co-products: N/A'
    - 'Default co-product approach: N/A'
    - 'Data source: Cooney et al. (2016)'
    - ''
    - 'This process is a part of NETL''s electricity baseline and is intended to capture the upstream emissions inventory for U.S. refinery products.'

  LCIMethod:
    - 'Attributional'
    - 'Cradle-to-Gate process'

  TechnologyDescription:

  TemporalDescription:
    'The time frame reflects the data representativeness for the crude oil mixes.'

  Start_date: '1/1/2016'

  End_date: '12/31/2016'

  DatasetOwner: 'Stanford University and University of Calgary'

  DataGenerator: 'Stanford University, University of Calgary, and NETL'

  DataDocumentor: 'Stanford University, University of Calgary, and NETL'

  ModelingConstants:
    'The model scope is intended to include fossil fuel resource production through delivery to the end user via the vehicle or pipeline transport in the United States.
    This scope is broken down into stages for production, mixes of produced fuel, mixes of consumed fuel, and distribution to the final user.
    Inputs to fuel production including fuels, capital infrastructure and other purchased goods or extracted resources, and any chemical release and hazardous wastes generated.
    One megajoule (MJ) is the declared unit used in processes within upstream life cycle stages. '

  DataSelection:
    'The Oil Production Greenhouse gas Emissions Estimator (OPGEE) and the Petroleum Refinery Life Cycle Inventory Model (PRELIM) were the main tools for modeling petroleum production and refining.
    OPGEE and PRELIM were developed by Stanford University and University of Calgary respectively.
    OPGEE is an engineering-based tool for calculating greenhouse gas (GHG) emissions for crude oil from its extraction until it arrives at a refinery, including transport.
    PRELIM is mass and energy-based process model that estimates of energy use and GHG emissions with processing crude oil in a refinery.
    Further information can be found in the petroleum baseline report.'

  DataTreatment:
    'Resource extraction processes are primarily based on PADD-reported data.
    All the fields defined through OPGEE were used as the pool for creating the LCI.
    The production quantities reported throughout the baselines list were used for the physical flows and to generate the emissions and wastes values from facilities like refineries.
    Locational data were used to associate a field with a region.
    Each fuel production process, defined by fuel type and regions, includes emissions to air and water.'

  SamplingProcedure:
    - 'BOUNDARY CONDITIONS'
    - 'All processes are compiled by US region using boundaries based on PADDs defined as ''subregions'' by the Energy Information Administration (EIA).
      Upstream fuel processes are also aggregated by energy source.
      Delivery to the final user is targeted toward an average end user without separation between different user types.
      The time span for all processes is one year.'
    - ''
    - 'DATA COLLECTION'
    - 'Data from 2016 were used to define the mix of crudes and petroleum refinery types.

      The method for generating the inventory largely follows the method detailed in Cooney et al. (2016), but, in this case, 2016 data were used for determining crude mixes and new versions of the model were used.
      Additionally, OPGEE was used to provide only the amounts of various fuels used in the production of crude, and NETL unit processes were used for combustion of those fuels to provide a more complete inventory.

      The model is constructed to provide the inventory for diesel fuel oil or residual fuel oil based on PADD.
      This inventory includes crude extraction (foreign and domestic), crude transportation, crude refining, and fuel transportation.

      All inventories were calculated using secondary data from publicly available datasets.'
    - ''
    - *no_uncertainty

  DataCollectionPeriod:
    'This process represents efforts conducted between 2018 and 2020.'

  Sources:

    Source1:
      <<: *cooney_etal

coal_transport_upstream:

  Description:
    - 'This process represents the cradle-to-gate inventory for the transportation of coal aggregated to basin, mine type, and coal type groups via the various modes of coal transportation.'
    - ''
    - 'Functional unit: 1 kilogram-kilometer of coal transported'
    - 'Co-products: N/A'
    - 'Default co-product approach: N/A'
    - 'Data source: Cutshaw et al. (2023)'
    - ''
    - 'This process is a part of NETL''s electricity baseline and is intended to capture the emissions inventory for coal transportation in the US. '

  LCIMethod:
    - 'Attributional'
    - 'Cradle-to-Gate process'

  TechnologyDescription:
    'This inventory includes impacts from fuel combustion for the various modes of coal transportation to power plants including: train, truck, tug and barge, ocean vessel, lake vessel, and conveyer.'

  TemporalDescription:
    'The time frame reflects the data representativeness within the coal baseline (i.e., 2016).'

  Start_date: '1/1/2016'

  End_date: '12/31/2016'

  DatasetOwner: 'NETL'

  DataGenerator: 'NETL'

  DataDocumentor: 'NETL'

  ModelingConstants:
    'The model scope is intended to include fossil fuel resource production through delivery to the end user via the vehicle or pipeline transport in the United States.
    This scope is broken down into stages for production, mixes of produced fuel, mixes of consumed fuel, and distribution to the final user.
    Inputs to fuel production including fuels, capital infrastructure and other purchased goods or extracted resources, and any chemical release and hazardous wastes generated.
    One megajoule (MJ) is the declared unit used in processes within upstream life cycle stages. '

  DataSelection:
    'AP-42 is a compilation of air emissions factors for over 200 air pollution source categories across various industries.
    AP-42 and EIA also provide heat-content data on petroleum fuel inputs which are used to relate heat input data to mass quantities of fuel and air emissions factors for fuels.
    These data are used for modeling fossil fuel transport.
    Further information can be found in the coal baseline report.
    Transportation distances are provided by ABB Velocity Suite.
    The source data has been obfuscated by aggregating transportation distances to transportation - the source includes transportation from power plants to individual mines or processing plants.'

  DataTreatment:
    'Resource extraction processes are primarily based on transportation-reported data.
    All the transportation defined through NETL were used as the pool for creating the LCI.
    The production quantities reported throughout the baselines list were used for the physical flows and to generate the emissions and wastes values from vehicles.
    Each transport type is defined by mode and includes emissions to air and water.
    Details on the coal modeling can be found in Cutshaw et al. (2023).'

  SamplingProcedure:
    - 'BOUNDARY CONDITIONS'
    - 'Coal transportation includes the combustion of fuels to transport coal using the various modes of transportation.'
    - ''
    - 'DATA COLLECTION'
    - 'Data from 2016 were used to define the amount, type, and origin of the coal used by each power plant, as well as year-specific parameters such as coal mine methane emissions.
      The aggregated inventory is created by using the transportation distances for each mode of transportation for each power plant reporting coal receipts in EIA for the year 2016.
      These inventories are then added to the power plant as upstream impacts similar to upstream coal.
      All inventories were calculated using secondary data from publicly available datasets.'
    - ''
    - *no_uncertainty

  DataCollectionPeriod:
    'This process represents efforts conducted between 2018 and 2023.'

  Sources:

    Source1:
      <<: *netl_2024_4846

