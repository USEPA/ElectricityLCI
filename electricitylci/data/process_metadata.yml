  LCI_2016:

    DataTreatment:
      - 'Material requirements to construct the solar PV panels and the balance of system are calculated using plant nameplate capacity and local insolation estimates to calculate the required area of solar panels, which are then used to scale inventories provided by literature.
        The total inventory from construction over the plant life is then divided by the assumed 30 year lifetime to provide emissions per year.
        These emissions are divided by the 2016 generation to create the inventory on the basis of 1 MWh.'
      - 'These are combined with plant operations inventories, which are calculated for each plant and placed on the basis of a MWh.
        Operations emissions are mostly from fossil fuel combustion, hydraulic oil, and external electricity use associated with operations.
        There may also be publicly-reported emissions assigned to the plant.'

    DataCollectionPeriod:
      'This inventory is representative of efforts that happened between 2018 and 2020.'

    SamplingProcedure:
      - 'BOUNDARY CONDITIONS'
      - 'The boundaries include power plant construction with all known material inputs (e.g., steel, glass, concrete) and some minor material requirements and fuel combustion for plant operation.'
      - ''
      - 'DATA COLLECTION'
      - 'Inventories were developed for each solar PV plant identified in the 2016 EIA 860 data using a custom life cycle model.
        Boundaries include plant construction and minor operating emissions from fuel combustion, etc.
        The total inventory for the plant construction is allocated over an assumed 30 year life.
        The resulting yearly construction emissions are divided by the 2016 generation to provide inventories per MWh (e.g., kg CO2/MWh).
        This is combined with the operations inventory, also on a per MWh basis.'
      - 'Data for the material inputs to the plant are from: NETL unit processes, US LCI, and ecoinvent.'
      - ''
      - *no_uncertainty

  LCI_2020:

    DataTreatment:
