    'Emissions from hydroelectric (hydro) power plants are representative of power plants located at reservoirs.
    Run-of-river hydro plants are considered to have minimal GHG emissions.
    Emissions from reservoir power plants are taken from Scherer & Pfister (2016).
    The emissions from that study are not exhaustive, so a regression model was used to predict methane and CO2 emissions from reservoirs based on the data within that study and U.S. reservoir environment and characteristics taken from the National Oceanic and Atmospheric Administration (NOAA), national inventory of dams (NID) database, EIA-923/60 with the goal of allocating either directly measured emissions or predicted emissions by major economic uses of the reservoir uses, such as electric power, recreation, irrigation, water supply etc.

